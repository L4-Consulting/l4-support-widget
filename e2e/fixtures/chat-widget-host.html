<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>chat widget host</title>
    <script>
      window.__l4ConsoleErrors = [];
      window.__l4CspEvents = [];
      window.addEventListener('error', (e) => window.__l4ConsoleErrors.push(String(e.message || e)));
    </script>
  </head>
  <body>
    <p id="fallback" hidden>legacy</p>
    <script>
      const assetPort = ({ '5299': 5300, '5301': 5302, '5303': 5304, '5320': 5321, '5360': 5361 })[location.port] ?? 5300;
      const assetOrigin = `http://127.0.0.1:${assetPort}`;
      const widgetScript = document.createElement('script');
      widgetScript.id = 'l4-widget-script';
      widgetScript.src = `${assetOrigin}/l4-support-widget.js`;
      widgetScript.crossOrigin = 'anonymous';
      document.body.appendChild(widgetScript);
      Object.defineProperty(document, 'currentScript', {
        configurable: true,
        get() {
          return widgetScript;
        },
      });
      function boot() {
        if (!window.L4Support) return;
        window.L4Support.init({
          productKey: 'pk',
          apiBase: 'https://api.example.test',
          getToken: () => 'tok',
          tabs: ['support'],
          chat: { enabled: true },
          onEvent: (event) => {
            if (event.type === 'chat_blocked_by_csp') window.__l4CspEvents.push(event.type);
            if (event.type === 'chat_load_failed') document.getElementById('fallback').hidden = false;
          },
        });
        window.L4Support.open();
      }
      widgetScript.addEventListener('load', boot);
      widgetScript.addEventListener('error', () => {
        document.getElementById('fallback').hidden = false;
      });
    </script>
  </body>
</html>
